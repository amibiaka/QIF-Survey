var C = {
 en: [
  ["Methodology in brief", ""],
  ["Why this survey", "Quality Infrastructure (QI), the system of standards, metrology, accreditation, conformity assessment and market surveillance, underpins trade competitiveness, industrial development and consumer protection. Across Africa, QI institutions remain chronically underfunded. Under the ACP Quality Infrastructure Programme (funded by the European Union and the OACPS), UNIDO, AUDA-NEPAD and the African Union Commission are building the evidence base on how QI is financed, where the gaps are, and which financing solutions are feasible. Results feed a continental publication in November 2026."],
  ["The adaptive design", "Each respondent answers 43 items in 20 to 25 minutes: a 6-item profile, a 19-question common core, one 8-question module fitted to the country's tier, one module of 8 to 9 questions for the respondent's institutional family, and a 2-item closing. Questions appear in screens of at most four. There are no right or wrong answers; FACT, ESTIMATE and PERCEPTION tags keep facts checkable and judgements honest."],
  ["Country tiers", "Every African Union member state (all 55) is assigned to one of three tiers before fieldwork, using only published, verifiable evidence: ILAC MRA signatory status (own or through the regional bodies SADCAS and SOAC), BIPM membership and CMCs published in the KCDB, ISO membership category, OIML membership, and ARSO and AFRIMETS participation, cross-checked against GQII 2025 and UNIDO's QI4SD Index 2024. The scoring rule is deterministic: anyone can recompute every assignment from the cited sources. Respondents answer no screening questions."],
  ["Three survey spaces: Africa, the Caribbean and the Pacific", "QIF Survey Master runs the survey in three spaces. Africa covers the 55 African Union member states, with implementation confirmed in 18 countries (Cote d'Ivoire, Ghana, Burkina Faso, Senegal; Ethiopia, Uganda, Mauritius, Djibouti; Zimbabwe, Zambia, Lesotho, Botswana; Tunisia, Mauritania, Egypt; Cameroon, Chad, Gabon); the super admin can open any other member state, including the Sahrawi Arab Democratic Republic should the African Union so decide. The Caribbean space covers the 16 OACPS member states of the Caribbean and the Pacific space the 15 OACPS member states of the Pacific; countries in these two spaces are opened for the survey by the super admin. Caribbean and Pacific countries are assigned to the same three tiers with the same published-evidence scoring used for Africa: recognized accreditation (own MRA signatory status under Global ACI, formerly IAF/ILAC, a regional signatory arrangement, or associate membership), metrology recognition (BIPM membership, or CGPM Associate status with or without CMCs in the KCDB, including regional coverage through the CARICOM Associate economy), ISO membership category, OIML membership, and regional participation (CROSQ, COPANT, SIM/CARIMET or COOMET in the Caribbean; PASC and APMP in the Pacific), cross-checked against GQII 2025 regional terciles. A country with no recognized engagement (score 0) is always Tier 1. Registers verified 28 August 2026; the full scored table with sources is downloadable from the insights page."],
  ["Who answers", "Seven respondent families: finance and budget authorities; policy, oversight and authorities; QI institutions; regulators and market surveillance; private sector and MSMEs; banks, DFIs and investors; development partners, RECs, academia and subnational government. Country coordinators target 11 to 20 respondents per country across the families."],
  ["Data protection", "Participation is voluntary and consent is collected first. Responses are confidential and reported only in aggregate; no public figure is shown from fewer than 3 respondents. Names and emails are stored separately from answers and used only for administration. Processing aligns with the AU Convention on Cyber Security and Personal Data Protection (Malabo Convention) and with the GDPR where applicable."],
  ["Zero-fabrication rule", "This platform never displays invented data. Analytics show only verified published statuses (with their as-of dates) and, once fieldwork begins, aggregated survey responses that pass validation and the aggregation threshold. Sample charts in this prototype carry a visible DEMO DATA mark."]
 ],
 fr: [
  ["La méthodologie en bref", ""],
  ["Pourquoi cette enquête", "L'infrastructure de la qualité (IQ), le système des normes, de la métrologie, de l'accréditation, de l'évaluation de la conformité et de la surveillance du marché, sous-tend la compétitivité commerciale, le développement industriel et la protection des consommateurs. En Afrique, les institutions de l'IQ demeurent chroniquement sous-financées. Dans le cadre du Programme Infrastructure Qualité ACP (financé par l'Union européenne et l'OEACP), l'ONUDI, l'AUDA-NEPAD et la Commission de l'Union africaine construisent la base de données sur le financement de l'IQ, les déficits et les solutions envisageables. Les résultats alimentent une publication continentale en novembre 2026."],
  ["La conception adaptative", "Chaque répondant traite 43 questions en 20 à 25 minutes : un profil de 6 questions, un tronc commun de 19 questions, un module de 8 questions adapté au palier du pays, un module de 8 à 9 questions propre à sa famille institutionnelle et une clôture de 2 questions. Les questions s'affichent par écrans de quatre au maximum. Il n'y a ni bonnes ni mauvaises réponses ; les étiquettes FACT, ESTIMATE et PERCEPTION distinguent les faits vérifiables des jugements professionnels."],
  ["Les paliers pays", "Chaque État membre de l'Union africaine (les 55) est affecté à l'un des trois paliers avant le terrain, sur la seule base de données publiées et vérifiables : statut de signataire du MRA de l'ILAC (en propre ou via les organismes régionaux SADCAS et SOAC), adhésion au BIPM et CMC publiées dans la KCDB, catégorie de membre ISO, adhésion à l'OIML, participation à l'ARSO et à AFRIMETS, avec recoupement par le GQII 2025 et l'indice QI4SD 2024 de l'ONUDI. La règle de notation est déterministe : chacun peut recalculer chaque affectation à partir des sources citées. Les répondants ne remplissent aucun questionnaire de présélection."],
  ["Trois espaces d'enquête : Afrique, Caraïbes, Pacifique", "QIF Survey Master déploie l'enquête dans trois espaces. L'Afrique couvre les 55 États membres de l'Union africaine, avec une mise en œuvre confirmée dans 18 pays (Côte d'Ivoire, Ghana, Burkina Faso, Sénégal ; Éthiopie, Ouganda, Maurice, Djibouti ; Zimbabwe, Zambie, Lesotho, Botswana ; Tunisie, Mauritanie, Égypte ; Cameroun, Tchad, Gabon) ; le super administrateur peut ouvrir tout autre État membre, y compris la République arabe sahraouie démocratique si l'Union africaine en décide ainsi. L'espace Caraïbes couvre les 16 États membres caribéens de l'OEACP et l'espace Pacifique les 15 États membres pacifiques ; les pays de ces deux espaces sont ouverts par le super administrateur. Les pays des Caraïbes et du Pacifique sont affectés aux trois mêmes paliers avec la même notation fondée sur des données publiées que pour l'Afrique : accréditation reconnue (signataire en propre du MRA sous Global ACI, anciennement IAF/ILAC, dispositif régional signataire ou statut d'associé), reconnaissance métrologique (adhésion au BIPM, statut d'associé à la CGPM avec ou sans CMC dans la KCDB, y compris la couverture régionale via l'économie associée CARICOM), catégorie de membre ISO, adhésion à l'OIML et participation régionale (CROSQ, COPANT, SIM/CARIMET ou COOMET pour les Caraïbes ; PASC et APMP pour le Pacifique), recoupées par les terciles régionaux du GQII 2025. Un pays sans engagement reconnu (score 0) est toujours au palier 1. Registres vérifiés le 28 août 2026 ; la table complète avec sources est téléchargeable depuis la page des données."],
  ["Qui répond", "Sept familles de répondants : autorités des finances et du budget ; politiques, contrôle et autorités ; institutions de l'IQ ; régulateurs et surveillance du marché ; secteur privé et MPME ; banques, IFD et investisseurs ; partenaires, CER, académie et collectivités. Les coordonnateurs nationaux visent 11 à 20 répondants par pays répartis entre les familles."],
  ["Protection des données", "La participation est volontaire et le consentement est recueilli en premier. Les réponses sont confidentielles et publiées uniquement sous forme agrégée ; aucun chiffre public n'est issu de moins de 3 répondants. Les noms et courriels sont conservés séparément des réponses et servent uniquement à l'administration. Le traitement s'aligne sur la Convention de Malabo de l'UA et sur le RGPD lorsqu'il s'applique."],
  ["Règle de zéro fabrication", "Cette plateforme n'affiche jamais de données inventées. Les analyses ne montrent que des statuts publiés vérifiés (avec leur date de référence) et, dès le début du terrain, des réponses agrégées ayant passé la validation et le seuil d'agrégation. Les graphiques d'exemple de ce prototype portent la mention visible DONNÉES DE DÉMONSTRATION."]
 ],
 ar: [
  ["المنهجية باختصار", ""],
  ["لماذا هذا الاستبيان", "البنية التحتية للجودة، أي منظومة المواصفات والمترولوجيا والاعتماد وتقييم المطابقة ومراقبة السوق، هي أساس القدرة التنافسية التجارية والتنمية الصناعية وحماية المستهلك. وتعاني مؤسساتها في أفريقيا نقصاً مزمناً في التمويل. في إطار برنامج البنية التحتية للجودة لدول أفريقيا والكاريبي والمحيط الهادئ (بتمويل من الاتحاد الأوروبي ومنظمة دول أفريقيا والكاريبي والمحيط الهادئ)، تبني اليونيدو وأودا-نيباد ومفوضية الاتحاد الأفريقي قاعدة الأدلة حول كيفية تمويل هذه المنظومة ومواطن الفجوات والحلول التمويلية الممكنة. وتغذي النتائج منشوراً قارياً في نوفمبر 2026."],
  ["التصميم التكيفي", "يجيب كل مشارك عن 43 عنصراً في 20 إلى 25 دقيقة: ملف تعريفي من 6 عناصر، وجذع مشترك من 19 سؤالاً، ووحدة من 8 أسئلة تناسب فئة البلد، ووحدة من 8 إلى 9 أسئلة تخص الفئة المؤسسية للمجيب، وخاتمة من عنصرين. وتظهر الأسئلة في شاشات لا تتجاوز أربعة أسئلة. لا توجد إجابات صحيحة أو خاطئة؛ وتميّز وسوم الحقيقة والتقدير والانطباع بين الوقائع القابلة للتحقق والأحكام المهنية."],
  ["فئات البلدان", "تُصنَّف كل دولة عضو في الاتحاد الأفريقي (وعددها 55) في واحدة من ثلاث فئات قبل العمل الميداني، استناداً حصراً إلى أدلة منشورة وقابلة للتحقق: صفة الموقِّع على ترتيب ILAC MRA (مباشرة أو عبر الهيئتين الإقليميتين سادكاس وسواك)، وعضوية المكتب الدولي للأوزان والمقاييس والقدرات المنشورة في قاعدة KCDB، وفئة العضوية في الأيزو، وعضوية المنظمة الدولية للمترولوجيا القانونية، والمشاركة في أرسو وأفريميتس، مع مقارنة بمؤشر GQII 2025 ومؤشر اليونيدو QI4SD 2024. قاعدة التصنيف حتمية: يمكن لأي جهة إعادة احتساب كل تصنيف من المصادر المذكورة. ولا يجيب المشاركون عن أي أسئلة فرز."],
  ["ثلاثة فضاءات للاستبيان: أفريقيا والكاريبي والمحيط الهادئ", "تدير منصة QIF Survey Master الاستبيان في ثلاثة فضاءات. يغطي فضاء أفريقيا الدول الأعضاء الـ55 في الاتحاد الأفريقي، مع تنفيذ مؤكد في 18 بلداً (كوت ديفوار وغانا وبوركينا فاسو والسنغال؛ وإثيوبيا وأوغندا وموريشيوس وجيبوتي؛ وزمبابوي وزامبيا وليسوتو وبوتسوانا؛ وتونس وموريتانيا ومصر؛ والكاميرون وتشاد والغابون)، ويمكن للمشرف العام فتح أي دولة عضو أخرى، بما فيها الجمهورية العربية الصحراوية الديمقراطية إذا قرر الاتحاد الأفريقي ذلك. ويغطي فضاء الكاريبي الدول الـ16 الأعضاء في منظمة الأواكبس من الكاريبي، وفضاء المحيط الهادئ الدول الـ15 الأعضاء من المحيط الهادئ؛ ويفتح المشرف العام بلدان هذين الفضاءين. وتُصنَّف بلدان الكاريبي والمحيط الهادئ في الفئات الثلاث نفسها بالمنهجية نفسها القائمة على أدلة منشورة: الاعتماد المعترف به (صفة الموقِّع المباشر في إطار Global ACI، سابقاً IAF/ILAC، أو ترتيب إقليمي موقِّع أو عضوية منتسبة)، والاعتراف المترولوجي (عضوية المكتب الدولي للأوزان والمقاييس، أو صفة المنتسب للمؤتمر العام مع قدرات منشورة أو دونها، بما في ذلك التغطية الإقليمية عبر اقتصاد كاريكوم المنتسب)، وفئة العضوية في الأيزو، وعضوية المنظمة الدولية للمترولوجيا القانونية، والمشاركة الإقليمية (كروسك وكوبانت وسيم/كاريميت أو كوميت في الكاريبي؛ وباسك وأبمب في المحيط الهادئ)، مع مقارنة بالأثلاث الإقليمية لمؤشر GQII 2025. وأي بلد بلا أي انخراط معترف به (الدرجة صفر) يُصنَّف دائماً في الفئة الأولى. تُحقِّق من السجلات في 28 أغسطس 2026؛ والجدول الكامل مع المصادر قابل للتنزيل من صفحة البيانات."],
  ["من يجيب", "سبع فئات من المجيبين: سلطات المالية والموازنة؛ السياسات والرقابة والهيئات؛ مؤسسات البنية التحتية للجودة؛ الجهات التنظيمية ومراقبة السوق؛ القطاع الخاص والمنشآت الصغرى والصغيرة والمتوسطة؛ المصارف ومؤسسات التمويل الإنمائي والمستثمرون؛ الشركاء والتجمعات الإقليمية والأوساط الأكاديمية والحكومات المحلية. ويستهدف المنسقون الوطنيون من 11 إلى 20 مجيباً في كل بلد موزعين على الفئات."],
  ["حماية البيانات", "المشاركة طوعية وتُجمع الموافقة أولاً. الإجابات سرية ولا تُنشر إلا بشكل مجمّع؛ ولا يُعرض أي رقم علني مستمد من أقل من ثلاثة مجيبين. وتُحفظ الأسماء وعناوين البريد منفصلة عن الإجابات وتُستخدم للأغراض الإدارية فقط. وتتوافق المعالجة مع اتفاقية مالابو للاتحاد الأفريقي ومع اللائحة الأوروبية لحماية البيانات حيثما تنطبق."],
  ["قاعدة عدم الاختلاق", "لا تعرض هذه المنصة أبداً بيانات مختلَقة. تُظهر التحليلات فقط الحالات المنشورة المُتحقَّق منها (مع تواريخها المرجعية)، وبعد بدء العمل الميداني، الإجابات المجمّعة التي تجتاز التحقق وعتبة التجميع. أما الرسوم التوضيحية في هذا النموذج فتحمل علامة «بيانات توضيحية» ظاهرة."]
 ]
};
