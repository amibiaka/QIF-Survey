<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Survey on Financing Quality Infrastructure and MSME Access to Finance in Africa. AUDA-NEPAD, UNIDO and the African Union Commission.">
<title>Financing Quality Infrastructure in Africa</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="main.css">
</head>
<body>
<main id="main">
  <div class="hero"><div class="wrap">
    <div class="kicker" id="h-kick"></div>
    <h1 id="h-title"></h1>
    <p class="lead" id="h-lead"></p>
    <p style="margin-top:22px">
      <a class="btn primary" id="h-cta" href="#"></a>
      <a class="btn ghost" id="h-cta2" href="#"></a>
    </p>
  </div></div>

  <section class="pad"><div class="wrap">
    <h2 class="sec" id="how-title"></h2>
    <div class="grid4" id="how-grid"></div>
  </div></section>

  <section class="pad" style="background:var(--light)"><div class="wrap">
    <h2 class="sec" id="c-title"></h2>
    <p class="sub" id="c-sub"></p>
    <div class="legend" id="c-legend"></div>
    <div class="afmap" id="afmap"></div>
    <div class="mapdetail" id="mapdetail"></div>
  </div></section>
</main>

<!-- Netlify Forms registration form (hidden): declares the fields stored by Netlify -->
<form name="qi-survey" netlify netlify-honeypot="bot-field" hidden>
  <input type="text" name="bot-field">
  <input type="text" name="language">
  <input type="text" name="country">
  <input type="text" name="country_iso3">
  <input type="text" name="tier">
  <input type="text" name="family">
  <input type="text" name="org">
  <input type="text" name="email">
  <input type="text" name="submitted_at">
  <textarea name="answers_json"></textarea>
</form>

<script src="i18n.js"></script>
<script src="common.js"></script>
<script src="countries.js"></script>
<script src="access.js"></script>
<script>
var __sess = QIA.session();
if (!__sess) { location.replace("index.html?lang=" + qiLang); }
qiMount("home");
var I = QI_I18N;
document.getElementById("h-kick").textContent = T(I.hero.kicker);
document.getElementById("h-title").textContent = T(I.hero.title);
document.getElementById("h-lead").textContent = T(I.hero.lead);
var cta = document.getElementById("h-cta"); cta.textContent = T(I.hero.cta); cta.href = "survey.html?lang=" + qiLang;
var cta2 = document.getElementById("h-cta2"); cta2.textContent = T(I.hero.cta2); cta2.href = "insights.html?lang=" + qiLang;
document.getElementById("how-title").textContent = T(I.how.title);
document.getElementById("how-grid").innerHTML = I.how.steps.map(function(s, i){
  return '<div class="card"><div class="stepnum">' + (i + 1) + '</div><h3>' + esc(T(s.t)) + '</h3><p>' + esc(T(s.d)) + '</p></div>';
}).join("");
document.getElementById("c-title").textContent = T(I.countries.title);
document.getElementById("c-sub").textContent = T(I.countries.sub);
document.getElementById("c-legend").innerHTML =
  '<span><i style="background:var(--t3)"></i>' + esc(T(I.tiers[3].name)) + '</span>' +
  '<span><i style="background:var(--t2)"></i>' + esc(T(I.tiers[2].name)) + '</span>' +
  '<span><i style="background:var(--t1)"></i>' + esc(T(I.tiers[1].name)) + '</span>' +
  '<span><i style="background:#fff;border:2px solid var(--navy);border-radius:50%"></i>' + esc(T(I.countries.active)) + '</span>';

// Dynamic map of Africa: every member state at its approximate position,
// colored by tier, wave-1 ringed. Tap or hover a country for details.
(function(){
  var TIERC = { 1:"#eb6834", 2:"#2a78d6", 3:"#008300" };
  var MAPTXT = {
    hint:{ en:"Tap a country for details.", fr:"Touchez un pays pour les détails.", ar:"اضغطوا على بلد لعرض التفاصيل." },
    score:{ en:"Recognition score", fr:"Score de reconnaissance", ar:"درجة الاعتراف" }
  };
  var lats = QI_COUNTRIES.map(function(c){ return c.lat; }), lons = QI_COUNTRIES.map(function(c){ return c.lon; });
  var minLa = Math.min.apply(null, lats) - 3, maxLa = Math.max.apply(null, lats) + 3;
  var minLo = Math.min.apply(null, lons) - 3, maxLo = Math.max.apply(null, lons) + 3;
  var W = 720, H = Math.round(W * (maxLa - minLa) / (maxLo - minLo));
  function px(lon){ return (lon - minLo) / (maxLo - minLo) * W; }
  function py(lat){ return (maxLa - lat) / (maxLa - minLa) * H; }
  var grid = "";
  for (var lo = Math.ceil(minLo / 10) * 10; lo <= maxLo; lo += 10) {
    var gx = px(lo).toFixed(1), main = (lo === 0);
    grid += '<line x1="' + gx + '" y1="0" x2="' + gx + '" y2="' + H + '" stroke="' + (main ? "#C3D4E0" : "#DFE9F0") + '" stroke-width="' + (main ? 1.4 : 1) + '"></line>';
  }
  for (var la = Math.ceil(minLa / 10) * 10; la <= maxLa; la += 10) {
    var gy = py(la).toFixed(1), eq = (la === 0);
    grid += '<line x1="0" y1="' + gy + '" x2="' + W + '" y2="' + gy + '" stroke="' + (eq ? "#C3D4E0" : "#DFE9F0") + '" stroke-width="' + (eq ? 1.4 : 1) + '"></line>';
    if (eq) grid += '<text x="6" y="' + (py(la) - 5) + '" font-size="9" fill="#8AA2B3">0°</text>';
  }
  var dots = "", rings = "";
  QI_COUNTRIES.forEach(function(c){
    var x = px(c.lon).toFixed(1), y = py(c.lat).toFixed(1);
    var r = c.w1 ? 11 : 8.5;
    if (c.w1) rings += '<circle class="w1ring" cx="' + x + '" cy="' + y + '" r="' + (r + 3.5) + '"></circle>';
    dots += '<circle class="cn" data-iso="' + c.iso3 + '" cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + TIERC[c.tier] + '" opacity="' + (c.w1 ? 1 : 0.62) + '"><title>' + esc(c[qiLang]) + '</title></circle>';
  });
  document.getElementById("afmap").innerHTML =
    '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(T(I.countries.title)) + '">' + grid + rings + dots + '</svg>';
  var detail = document.getElementById("mapdetail");
  detail.innerHTML = '<span class="dim">' + esc(T(MAPTXT.hint)) + '</span>';
  function show(iso){
    var c = QI_COUNTRIES.find(function(x){ return x.iso3 === iso; }); if (!c) return;
    document.querySelectorAll(".afmap circle.cn").forEach(function(el){ el.classList.toggle("sel", el.getAttribute("data-iso") === iso); });
    detail.innerHTML = "<b>" + esc(c[qiLang]) + "</b>" +
      '<span class="tierpill t' + c.tier + '">' + esc(T(I.tiers[c.tier].name)) + "</span>" +
      '<span>' + esc(T(MAPTXT.score)) + " S: <b>" + c.score.toFixed(1) + "</b></span>" +
      '<span class="dim">' + esc(c.w1 ? T(I.countries.active) : T(I.countries.later)) + "</span>";
  }
  document.querySelectorAll(".afmap circle.cn").forEach(function(el){
    el.addEventListener("click", function(){ show(el.getAttribute("data-iso")); });
    el.addEventListener("mouseenter", function(){ show(el.getAttribute("data-iso")); });
  });
  show("GHA");
})();
</script>
</body>
</html>
