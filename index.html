<style>
/* ---- v3.3 landing: simplified, direct (collision-free lp- classes) ---- */
.gate{--cream:#F7F4EE;--ink:#10233A;--hair:rgba(16,35,58,.14);--mut:#55646F;--nv:#14486B;--tl:#0E7C86;--gn:#1E7D5A;--bl:#2E6FDB;
  min-height:100vh;background:
  radial-gradient(1100px 540px at 90% -10%,rgba(14,124,134,.09),transparent 62%),
  radial-gradient(900px 520px at -10% 30%,rgba(46,111,219,.06),transparent 55%),#F7F4EE;
  font-family:"Space Grotesk","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
.gatetop{position:sticky;top:0;z-index:60;display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding:11px clamp(16px,4vw,46px);background:rgba(247,244,238,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.lp-brand{display:flex;align-items:center;gap:11px;min-width:0}
.lp-brand .lp-name{font-size:12.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gatemain{display:block;padding:0}
.gatecard.wide{max-width:1120px;margin:0 auto;background:transparent;border:0;box-shadow:none;border-radius:0;padding:clamp(26px,5vw,60px) clamp(16px,4vw,46px) 70px}

/* hero */
.lp-hero{position:relative;padding:clamp(6px,1.6vw,18px) 0 clamp(22px,3vw,34px)}
.lp-hero::before{content:"";position:absolute;inset:-30px -60px 0;pointer-events:none;
  background:repeating-linear-gradient(90deg,var(--hair) 0 1px,transparent 1px 56px),repeating-linear-gradient(0deg,var(--hair) 0 1px,transparent 1px 56px);
  opacity:.35;-webkit-mask-image:radial-gradient(75% 90% at 30% 20%,#000 0%,transparent 78%);mask-image:radial-gradient(75% 90% at 30% 20%,#000 0%,transparent 78%)}
.lp-kick{position:relative;font-size:12px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--tl)}
.lp-kick::before{content:"";display:block;width:58px;height:3px;background:var(--tl);border-radius:2px;margin:0 0 12px}
#g-title{position:relative;font-size:clamp(1.9rem,5vw,3.7rem);line-height:1.05;letter-spacing:-.02em;text-transform:uppercase;font-weight:700;color:var(--ink);margin:.35em 0 .32em;max-width:26ch}
html[dir="rtl"] #g-title{letter-spacing:0;line-height:1.22;text-transform:none}
.lp-lede{position:relative;font-size:clamp(15px,1.6vw,17px);line-height:1.6;color:var(--mut);max-width:64ch;margin:0 0 16px}
.partners{position:relative;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut);line-height:1.8;margin:0;max-width:95ch}

/* section labels */
.seclab{display:flex;align-items:center;gap:12px;margin:40px 0 16px;font-size:11.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--ink)}
.seclab i{font-style:normal;color:var(--tl)}
.seclab::after{content:"";flex:1;height:1px;background:var(--hair)}

/* entry doors */
.lp-entry{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.lp-door{position:relative;border-radius:18px;padding:26px 26px 24px;border:1px solid var(--hair);transition:transform .22s ease,box-shadow .22s ease}
.lp-door:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(16,35,58,.10)}
.lp-door.resp{background:#fff}
.lp-door.adm{background:var(--nv);border-color:transparent}
.lp-tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;border-radius:999px;padding:4px 11px;margin:0 0 14px}
.resp .lp-tag{background:rgba(14,124,134,.12);color:var(--tl)}
.adm .lp-tag{background:rgba(255,255,255,.14);color:#8FD1C8}
.lp-door h3{margin:0 0 8px;font-size:clamp(1.15rem,2vw,1.4rem);line-height:1.25}
.resp h3{color:var(--ink)} .adm h3{color:#fff}
.lp-door p{margin:0;font-size:13.5px;line-height:1.55}
.resp p{color:var(--mut)} .adm p{color:#CADCE8}
.lp-btn{display:inline-block;margin-top:16px;padding:12px 24px;border-radius:12px;font-weight:700;font-size:14.5px;text-decoration:none;cursor:pointer;border:0;font-family:inherit;transition:transform .15s ease,background .2s ease}
.lp-btn:hover{transform:translateY(-1px)}
.resp .lp-btn{background:var(--tl);color:#fff}
.adm .lp-btn{background:#fff;color:var(--nv)}

/* why this survey */
.objbox{border:0;background:transparent;padding:0;margin:0}
.objbox p{color:#26394A;line-height:1.75;font-size:15px;max-width:84ch;margin:0;white-space:pre-line}

/* sign-up */
#signup-wrap[hidden]{display:none}
.gatebox{background:#fff;border:1px solid var(--hair);border-radius:18px;padding:clamp(16px,3vw,30px);box-shadow:0 22px 60px rgba(16,35,58,.07)}
.gatebtn{background:var(--ink);border:0;border-radius:12px;color:#fff;font-weight:700;padding:13px 26px;cursor:pointer;font-family:inherit;transition:background .2s,transform .15s}
.gatebtn:hover{background:var(--nv);transform:translateY(-1px)}
.gatehint{color:var(--mut)}
.gatefoot{border-top:1px solid var(--hair);color:var(--mut)}

/* logos */
.lp-logos{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.lp-logo{display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--hair);border-radius:15px;min-height:88px;padding:16px 20px;transition:transform .22s ease,box-shadow .22s ease}
.lp-logo:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(16,35,58,.08)}
.lp-logo img{max-height:50px;max-width:100%;width:auto;height:auto;display:block}
.lp-logo i{display:none;font-style:normal;font-weight:700;color:var(--nv);font-size:13.5px;text-align:center;letter-spacing:.05em}
.lp-logo.txt i{display:block}

/* tutorial video */
.lp-vid{background:#fff;border:1px solid var(--hair);border-radius:18px;padding:clamp(14px,2.5vw,22px);box-shadow:0 22px 60px rgba(16,35,58,.07)}
.lp-vhead{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 14px}
.lp-vhead p{margin:0;font-size:13.5px;line-height:1.55;color:var(--mut);max-width:62ch;text-align:start}
.lp-vpills{display:flex;gap:8px}
.lp-vpills button{border:1px solid var(--hair);background:#fff;color:var(--nv);font-family:inherit;font-weight:700;font-size:12.5px;letter-spacing:.06em;border-radius:999px;padding:7px 16px;cursor:pointer;transition:background .2s,color .2s}
.lp-vpills button[aria-pressed="true"]{background:var(--nv);color:#fff;border-color:var(--nv)}
#tut-vid{display:block;width:100%;aspect-ratio:16/9;border-radius:12px;background:#0F2233;outline:none}

.rv{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){.rv{opacity:1;transform:none;transition:none}.lp-door,.lp-logo,.lp-btn,.gatebtn{transition:none}}
</style>
</head>
<body>
<div class="gate">
  <div class="gatetop">
    <div class="lp-brand"><span class="mark">QI</span><span class="lp-name" id="lp-name"></span></div>
    <div class="langs" role="group" aria-label="Language" id="langs" style="margin:0"></div>
  </div>
  <main class="gatemain" id="main">
    <div class="gatecard wide">
      <section class="lp-hero rv in">
        <div class="lp-kick" id="g-app"></div>
        <h1 id="g-title"></h1>
        <p class="lp-lede" id="g-lede"></p>
        <p class="partners" id="g-partners"></p>
      </section>

      <section class="rv in">
        <div class="seclab"><i>01</i><span id="g-acc"></span></div>
        <div class="lp-entry">
          <div class="lp-door resp">
            <span class="lp-tag" id="d-r-tag"></span>
            <h3 id="d-r-t"></h3>
            <p id="d-r-b"></p>
            <button type="button" class="lp-btn" id="d-r-btn"></button>
          </div>
          <div class="lp-door adm">
            <span class="lp-tag" id="d-a-tag"></span>
            <h3 id="d-a-t"></h3>
            <p id="d-a-b"></p>
            <a class="lp-btn" id="d-a-btn" href="admin.html"></a>
          </div>
        </div>
        <div id="signup-wrap" hidden style="margin-top:16px">
          <div class="gatebox">
            <form id="f-signup" autocomplete="off">
              <p class="gatehint" id="s-intro" style="margin-top:0"></p>
              <label for="s-name" id="lb-name"></label>
              <input id="s-name" type="text" maxlength="120">
              <label for="s-country" id="lb-country"></label>
              <select id="s-country"></select>
              <label for="s-cat" id="lb-cat"></label>
              <select id="s-cat"></select>
              <div class="gate2col">
                <div>
                  <label for="s-title" id="lb-title"></label>
                  <input id="s-title" type="text" maxlength="120">
                </div>
                <div>
                  <label for="s-level" id="lb-level"></label>
                  <select id="s-level"></select>
                </div>
              </div>
              <div class="gate2col">
                <div>
                  <label for="s-email" id="lb-email"></label>
                  <input id="s-email" type="email" maxlength="140">
                </div>
                <div>
                  <label for="s-phone" id="lb-phone"></label>
                  <input id="s-phone" type="tel" maxlength="30">
                </div>
              </div>
              <button class="gatebtn" type="submit" id="b-signup"></button>
              <div class="gatemsg" id="m-signup"></div>
              <div class="issued" id="issued" style="display:none"></div>
            </form>
          </div>
        </div>
      </section>

      <section class="rv">
        <div class="seclab"><i>02</i><span id="g-tut"></span></div>
        <div class="lp-vid">
          <div class="lp-vhead">
            <p id="tut-lede"></p>
            <div class="lp-vpills" id="vpills" role="group" aria-label="Tutorial language">
              <button type="button" data-v="en" aria-pressed="false">English</button>
              <button type="button" data-v="fr" aria-pressed="false">Français</button>
            </div>
          </div>
          <video id="tut-vid" controls playsinline preload="none" poster="tutorial-en.jpg" src="tutorial-en.mp4"></video>
        </div>
      </section>

      <section class="objbox rv">
        <div class="seclab"><i>03</i><span id="obj-t"></span></div>
        <p id="obj-b"></p>
      </section>

      <section class="rv">
        <div class="seclab"><i>04</i><span id="g-impl"></span></div>
        <div class="lp-logos" id="plogos"></div>
      </section>

      <p class="gatehint" id="g-owner" style="margin-top:34px;font-weight:600"></p>
    </div>
  </main>
  <div class="gatefoot" id="g-foot"></div>
</div>

<!-- Netlify Forms registration (demo-mode fallback capture) -->
<form name="qi-survey" netlify netlify-honeypot="bot-field" hidden>
  <input type="text" name="bot-field">
  <input type="text" name="language"><input type="text" name="country">
  <input type="text" name="country_iso3"><input type="text" name="tier">
  <input type="text" name="family"><input type="text" name="respondent_id">
  <input type="text" name="org"><input type="text" name="email">
  <input type="text" name="submitted_at"><textarea name="answers_json"></textarea>
</form>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script src="countries.js"></script>
<script src="bank_part1.js"></script>
<script src="db.js"></script>
<script src="access.js"></script>
<script>
// Already signed in: go straight to the home page.
if (QIA.session()) location.replace("home.html?lang=" + qiLang);

var I = QI_I18N;
var GATE = {
  intro:{ en:"Request access. If your details are validated automatically you receive your personal survey link immediately; otherwise the survey super admin reviews your request.",
          fr:"Demandez un accès. Si vos informations sont validées automatiquement, vous recevez immédiatement votre lien personnel d'enquête ; sinon, le super administrateur examine votre demande.",
          ar:"اطلبوا الوصول. إذا تم التحقق من بياناتكم تلقائياً تستلمون رابط الاستبيان الشخصي فوراً؛ وإلا يراجع المشرف العام طلبكم." },
  name:{ en:"Full name", fr:"Nom complet", ar:"الاسم الكامل" },
  country:{ en:"Country or location", fr:"Pays ou localisation", ar:"البلد أو الموقع" },
  cat:{ en:"Organization type / sector", fr:"Type d'organisation / secteur", ar:"نوع المنظمة / القطاع" },
  jobtitle:{ en:"Job title", fr:"Intitulé du poste", ar:"المسمى الوظيفي" },
  level:{ en:"Hierarchical level", fr:"Niveau hiérarchique", ar:"المستوى الوظيفي" },
  email:{ en:"Email", fr:"Courriel", ar:"البريد الإلكتروني" },
  phone:{ en:"or phone", fr:"ou téléphone", ar:"أو الهاتف" },
  send:{ en:"Request access", fr:"Demander l'accès", ar:"طلب الوصول" },
  missing:{ en:"Please complete every field and give an email or a phone number.",
            fr:"Veuillez remplir tous les champs et indiquer un courriel ou un numéro de téléphone.",
            ar:"يُرجى تعبئة جميع الحقول وتقديم بريد إلكتروني أو رقم هاتف." },
  duplicate:{ en:"A request or access already exists for this email.",
              fr:"Une demande ou un accès existe déjà pour ce courriel.",
              ar:"يوجد طلب أو وصول مسبق لهذا البريد الإلكتروني." },
  autoOk:{ en:"Access granted automatically. Open your personal survey link (also sent to you when email delivery is configured):",
           fr:"Accès accordé automatiquement. Ouvrez votre lien personnel d'enquête (également envoyé lorsque l'envoi de courriels est configuré) :",
           ar:"تم منح الوصول تلقائياً. افتحوا رابط الاستبيان الشخصي (يُرسل أيضاً عند تفعيل البريد الإلكتروني):" },
  goSurvey:{ en:"Start my survey now", fr:"Commencer mon enquête maintenant", ar:"بدء الاستبيان الآن" },
  pendingQuota:{ en:"The seats for this profile in your country are taken. Your request has been sent to the super admin for review.",
                 fr:"Les places pour ce profil dans votre pays sont prises. Votre demande a été transmise au super administrateur.",
                 ar:"المقاعد المخصصة لهذا الملف في بلدكم مشغولة. أُحيل طلبكم إلى المشرف العام للمراجعة." },
  pendingWave:{ en:"Your country is not yet open for the survey. Your request has been waitlisted with the super admin.",
                fr:"Votre pays n'est pas encore ouvert à l'enquête. Votre demande est en liste d'attente auprès du super administrateur.",
                ar:"بلدكم غير مفتوح للاستبيان بعد. وُضع طلبكم في قائمة انتظار لدى المشرف العام." },
  choose:{ en:"Select…", fr:"Sélectionnez…", ar:"اختاروا…" },
  closedTag:{ en:"not yet open", fr:"pas encore ouvert", ar:"غير مفتوح بعد" }
};

var HERO = {
  title:{ en:"Financing Quality Infrastructure and MSME Access to Finance",
          fr:"Financer l'infrastructure de la qualité et l'accès des MPME au financement",
          ar:"تمويل البنية التحتية للجودة ووصول المنشآت الصغرى والصغيرة والمتوسطة إلى التمويل" },
  lede:{ en:"One adaptive, trilingual survey across Africa, the Caribbean and the Pacific, building the evidence base and the investment case for standards, metrology, accreditation and conformity assessment.",
         fr:"Une enquête adaptative et trilingue à travers l'Afrique, les Caraïbes et le Pacifique, qui construit la base factuelle et le dossier d'investissement pour la normalisation, la métrologie, l'accréditation et l'évaluation de la conformité.",
         ar:"استبيان تكيفي ثلاثي اللغات عبر أفريقيا والكاريبي والمحيط الهادئ، يبني قاعدة الأدلة وملف الاستثمار للمواصفات والمترولوجيا والاعتماد وتقييم المطابقة." }
};

var LBL = {
  acc:{ en:"Enter the platform", fr:"Accéder à la plateforme", ar:"الدخول إلى المنصة" },
  impl:{ en:"In collaboration with", fr:"En collaboration avec", ar:"بالتعاون مع" },
  rTag:{ en:"Respondents", fr:"Répondants", ar:"المجيبون" },
  rT:{ en:"Answer the survey", fr:"Répondre à l'enquête", ar:"المشاركة في الاستبيان" },
  rB:{ en:"Open the personal link from your invitation email to start or resume your questionnaire. No link yet? Request access and receive yours.",
       fr:"Ouvrez le lien personnel reçu par email pour commencer ou reprendre votre questionnaire. Pas encore de lien ? Demandez l'accès pour recevoir le vôtre.",
       ar:"افتحوا الرابط الشخصي الوارد في بريد الدعوة لبدء الاستبيان أو استئنافه. لا يوجد رابط بعد؟ اطلبوا الوصول لاستلام رابطكم." },
  rBtn:{ en:"Request access", fr:"Demander l'accès", ar:"طلب الوصول" },
  aTag:{ en:"Administration", fr:"Administration", ar:"الإدارة" },
  aT:{ en:"Administrators and super administrators", fr:"Administrateurs et super administrateurs", ar:"المديرون والمشرفون العامون" },
  aB:{ en:"Open countries, create administrators and respondents, monitor participation and download data, according to your rights.",
       fr:"Ouvrez des pays, créez des administrateurs et des répondants, suivez la participation et téléchargez les données, selon vos droits.",
       ar:"افتحوا البلدان وأنشئوا المديرين والمجيبين وتابعوا المشاركة ونزّلوا البيانات وفق صلاحياتكم." },
  aBtn:{ en:"Administrator sign-in", fr:"Connexion administrateur", ar:"دخول المديرين" },
  tut:{ en:"How it works", fr:"Comment ça fonctionne", ar:"كيف تعمل المنصة" },
  tutB:{ en:"A two-and-a-half-minute guided tour: requesting access, signing in, answering the questions and submitting your responses, with our confidentiality and security commitments.",
         fr:"Une visite guidée de deux minutes trente : demande d'accès, connexion, réponse aux questions et envoi, avec nos engagements de confidentialité et de sécurité.",
         ar:"جولة إرشادية مدتها دقيقتان ونصف: طلب الوصول وتسجيل الدخول والإجابة عن الأسئلة وإرسالها، مع التزاماتنا بالسرية والأمان." }
};

document.getElementById("lp-name").textContent = T(I.product.name);
document.getElementById("g-app").textContent = T(I.product.name);
document.getElementById("g-title").textContent = T(HERO.title);
document.getElementById("g-lede").textContent = T(HERO.lede);
document.getElementById("g-partners").textContent = T(I.partners);
document.getElementById("g-owner").textContent = T(I.product.owner);
document.getElementById("g-foot").textContent = T(I.footer.privacy);
document.getElementById("obj-t").textContent = T(I.objectives.title);
document.getElementById("obj-b").textContent = T(I.objectives.body);
document.getElementById("g-acc").textContent = T(LBL.acc);
document.getElementById("g-impl").textContent = T(LBL.impl);
document.getElementById("d-r-tag").textContent = T(LBL.rTag);
document.getElementById("d-r-t").textContent = T(LBL.rT);
document.getElementById("d-r-b").textContent = T(LBL.rB);
document.getElementById("d-r-btn").textContent = T(LBL.rBtn);
document.getElementById("d-a-tag").textContent = T(LBL.aTag);
document.getElementById("d-a-t").textContent = T(LBL.aT);
document.getElementById("d-a-b").textContent = T(LBL.aB);
var aBtn = document.getElementById("d-a-btn");
aBtn.textContent = T(LBL.aBtn);
aBtn.href = "admin.html?lang=" + qiLang;

document.getElementById("langs").innerHTML = ["en","fr","ar"].map(function(l){
  return '<button type="button" style="border-color:var(--line);color:var(--navy)" aria-pressed="' + (l === qiLang) + '" onclick="setLang(\'' + l + '\')">' + I.langNames[l] + '</button>';
}).join("");
document.querySelectorAll('#langs button').forEach(function(b){
  if (b.getAttribute("aria-pressed") === "true") { b.style.background = "var(--navy)"; b.style.color = "#fff"; b.style.borderColor = "var(--navy)"; }
});

// Partner logos: official marks served from this site, wordmark fallback.
var LOGOS = [["unido.svg","UNIDO"],["oacps.webp","OACPS"],["auda-nepad.png","AUDA-NEPAD"],["auc.webp","African Union Commission"],[null,"CROSQ"],[null,"Pacific Islands Forum"]];
document.getElementById("plogos").innerHTML = LOGOS.map(function(l){
  if (!l[0]) return '<span class="lp-logo txt"><i>' + l[1] + '</i></span>';
  return '<span class="lp-logo"><img src="' + l[0] + '" alt="' + l[1] + '" loading="lazy" ' +
    'onerror="this.parentNode.classList.add(\'txt\');this.remove()"><i>' + l[1] + '</i></span>';
}).join("");

(function(){
  var v = document.getElementById("tut-vid");
  v.setAttribute("aria-label", T(LBL.tut));
  function pick(l, play){
    v.pause();
    v.setAttribute("poster", "tutorial-" + l + ".jpg");
    v.src = "tutorial-" + l + ".mp4";
    v.load();
    document.querySelectorAll("#vpills button").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.getAttribute("data-v") === l));
    });
    if (play) v.play();
  }
  document.querySelectorAll("#vpills button").forEach(function(b){
    b.addEventListener("click", function(){
      if (b.getAttribute("aria-pressed") !== "true") pick(b.getAttribute("data-v"), !v.paused && !v.ended);
    });
  });
  pick(qiLang === "fr" ? "fr" : "en", false);
})();

var csel = document.getElementById("s-country");
function paintCountrySelect(statusMap){
  var groups = ["africa","caribbean","pacific","partners"].map(function(reg){
    var opts = QI_COUNTRIES.filter(function(c){ return c.region === reg; })
      .sort(function(a, b){ return a[qiLang].localeCompare(b[qiLang], qiLang); })
      .map(function(c){
        var open = statusMap ? statusMap[c.iso3] : c.w1;
        return '<option value="' + c.iso3 + '">' + esc(c[qiLang]) + (open ? "" : " · " + esc(T(GATE.closedTag))) + '</option>';
      }).join("");
    return '<optgroup label="' + esc(T(I.regions[reg])) + '">' + opts + '</optgroup>';
  }).join("");
  csel.innerHTML = '<option value="">' + esc(T(GATE.choose)) + '</option>' + groups;
}
paintCountrySelect(null);
QIDB.countryStatus().then(function(st){ paintCountrySelect(st); });

var P2 = QI_BANK_P1.profile.find(function(q){ return q.id === "P2"; });
var P3 = QI_BANK_P1.profile.find(function(q){ return q.id === "P3"; });
document.getElementById("s-cat").innerHTML = '<option value="">' + esc(T(GATE.choose)) + '</option>' +
  P2.opts.map(function(o){ return '<option value="' + o.v + '">' + esc(T(o.t)) + '</option>'; }).join("");
document.getElementById("s-level").innerHTML = '<option value="">' + esc(T(GATE.choose)) + '</option>' +
  P3.opts.map(function(o){ return '<option value="' + o.v + '">' + esc(T(o.t)) + '</option>'; }).join("");

function showIssued(link){
  var box = document.getElementById("issued");
  box.style.display = "block";
  box.innerHTML = "<b>" + esc(T(GATE.autoOk)) + "</b>" +
    '<div class="big" style="font-size:13px;word-break:break-all">' + esc(link) + "</div>" +
    '<a class="gatebtn" style="display:block;text-align:center;text-decoration:none;margin-top:8px" href="' + esc(link) + '">' + esc(T(GATE.goSurvey)) + "</a>";
}

document.getElementById("f-signup").addEventListener("submit", function(e){
  e.preventDefault();
  var m = document.getElementById("m-signup"); m.className = "gatemsg";
  var box = document.getElementById("issued"); box.style.display = "none";
  var p = {
    name: document.getElementById("s-name").value.trim(),
    iso3: csel.value,
    category: document.getElementById("s-cat").value,
    job_title: document.getElementById("s-title").value.trim(),
    level: document.getElementById("s-level").value,
    email: document.getElementById("s-email").value.trim(),
    phone: document.getElementById("s-phone").value.trim()
  };
  if (!p.name || !p.iso3 || !p.category || !p.level || (!p.email && !p.phone)) {
    m.className = "gatemsg err"; m.textContent = T(GATE.missing); return;
  }
  if (QIDB.mode() === "live") {
    QIDB.requestAccess(p).then(function(r){
      if (!r || !r.ok) { m.className = "gatemsg err"; m.textContent = T(r && r.why === "duplicate" ? GATE.duplicate : GATE.missing); return; }
      if (r.mode === "auto") { showIssued(location.origin + location.pathname.replace(/index\.html$/, "") + "survey.html?rt=" + r.token + "&lang=" + qiLang); }
      else { m.className = "gatemsg ok"; m.textContent = T(r.reason === "quota" ? GATE.pendingQuota : GATE.pendingWave); }
    });
    return;
  }
  var r = QIA.signup({ name:p.name, iso3:p.iso3, cat:p.category, title:p.job_title, level:p.level, email:p.email, phone:p.phone });
  if (!r.ok) { m.className = "gatemsg err"; m.textContent = T(r.why === "duplicate" ? GATE.duplicate : GATE.missing); return; }
  if (r.mode === "auto") {
    QIDB.createInvite({ email:p.email || p.phone, name:p.name, iso3:p.iso3, category:p.category, level:p.level, created_by:"auto-validation" })
      .then(function(iv){ showIssued(location.origin + location.pathname.replace(/index\.html$/, "") + "survey.html?rt=" + iv.token + "&lang=" + qiLang); });
  } else {
    m.className = "gatemsg ok";
    m.textContent = T(r.reason === "quota" ? GATE.pendingQuota : GATE.pendingWave);
  }
});

// Reveal on scroll.
(function(){
  var els = document.querySelectorAll(".rv");
  if (!("IntersectionObserver" in window)) { els.forEach(function(n){ n.classList.add("in"); }); return; }
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { threshold: 0.1 });
  els.forEach(function(n){ io.observe(n); });
})();
document.title = T(I.product.name) + " · " + T(I.siteTitle);
</script>
