<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QIF Survey Master · Financing Quality Infrastructure in Africa, the Caribbean and the Pacific</title>
<meta name="description" content="QIF Survey Master, the AUDA-NEPAD survey platform. Survey on Financing Quality Infrastructure and MSME Access to Finance, run by AUDA-NEPAD, UNIDO and the African Union Commission in collaboration with the OACPS across Africa, the Caribbean and the Pacific.">
<meta name="keywords" content="quality infrastructure, QI financing, MSME, AUDA-NEPAD, UNIDO, African Union, OACPS, survey, standards, metrology, accreditation">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://qif-au-survey.netlify.app/index.html">
<link rel="alternate" hreflang="en" href="https://qif-au-survey.netlify.app/index.html?lang=en">
<link rel="alternate" hreflang="fr" href="https://qif-au-survey.netlify.app/index.html?lang=fr">
<link rel="alternate" hreflang="ar" href="https://qif-au-survey.netlify.app/index.html?lang=ar">
<meta property="og:type" content="website">
<meta property="og:title" content="QIF Survey Master">
<meta property="og:description" content="Survey on Financing Quality Infrastructure and MSME Access to Finance. AUDA-NEPAD | UNIDO | AUC | OACPS.">
<meta property="og:url" content="https://qif-au-survey.netlify.app/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="main.css">
</head>
<body>
<div class="gate">
  <div class="gatetop">
    <span class="mark">QI</span>
    <div class="langs" role="group" aria-label="Language" id="langs" style="margin:0"></div>
  </div>
  <main class="gatemain" id="main">
    <div class="gatecard wide">
      <div class="mastername" id="g-app"></div>
      <h1 id="g-title"></h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="partners" id="g-partners"></p>
      <div class="plogos" id="plogos"></div>

      <div class="spaces" id="spaces"></div>

      <div class="objbox">
        <h2 id="obj-t"></h2>
        <p id="obj-b"></p>
      </div>

      <div class="gatebox">
        <div class="gatetabs" role="tablist">
          <button type="button" id="tab-login" role="tab" aria-selected="true"></button>
          <button type="button" id="tab-signup" role="tab" aria-selected="false"></button>
        </div>

        <form id="f-login" autocomplete="off">
          <p class="gatehint" id="l-intro" style="margin-top:0"></p>
          <div class="rolepick" id="rolepick"></div>
          <button class="gatebtn" type="submit" id="b-login"></button>
          <div class="gatemsg" id="m-login"></div>
          <p class="gatehint" id="h-id"></p>
        </form>

        <form id="f-signup" autocomplete="off" style="display:none">
          <p class="gatehint" id="s-intro" style="margin-top:0"></p>
          <label for="s-name" id="lb-name"></label>
          <input id="s-name" type="text" maxlength="120">
          <label for="s-country" id="lb-country"></label>
          <select id="s-country"></select>
          <label for="s-cat" id="lb-cat"></label>
          <select id="s-cat"></select>
          <div class="gate2col">
            <div>
              <label for="s-title" id="lb-title"></label>
              <input id="s-title" type="text" maxlength="120">
            </div>
            <div>
              <label for="s-level" id="lb-level"></label>
              <select id="s-level"></select>
            </div>
          </div>
          <div class="gate2col">
            <div>
              <label for="s-email" id="lb-email"></label>
              <input id="s-email" type="email" maxlength="140">
            </div>
            <div>
              <label for="s-phone" id="lb-phone"></label>
              <input id="s-phone" type="tel" maxlength="30">
            </div>
          </div>
          <button class="gatebtn" type="submit" id="b-signup"></button>
          <div class="gatemsg" id="m-signup"></div>
          <div class="issued" id="issued" style="display:none"></div>
        </form>
      </div>
      <p class="gatehint" id="g-proto"></p>
      <p class="gatehint" id="g-owner" style="margin-top:4px;font-weight:600"></p>
    </div>
  </main>
  <div class="gatefoot" id="g-foot"></div>
</div>

<!-- Netlify Forms registration (demo-mode fallback capture) -->
<form name="qi-survey" netlify netlify-honeypot="bot-field" hidden>
  <input type="text" name="bot-field">
  <input type="text" name="language"><input type="text" name="country">
  <input type="text" name="country_iso3"><input type="text" name="tier">
  <input type="text" name="family"><input type="text" name="respondent_id">
  <input type="text" name="org"><input type="text" name="email">
  <input type="text" name="submitted_at"><textarea name="answers_json"></textarea>
</form>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script src="countries.js"></script>
<script src="bank_part1.js"></script>
<script src="db.js"></script>
<script src="access.js"></script>
<script>
// Already signed in: go straight to the home page.
if (QIA.session()) location.replace("home.html?lang=" + qiLang);

var I = QI_I18N, A = I.auth;
var GATE = {
  tabLogin:{ en:"Log in", fr:"Se connecter", ar:"تسجيل الدخول" },
  tabSignup:{ en:"Sign up", fr:"S'inscrire", ar:"إنشاء حساب" },
  intro:{ en:"Request access. If your details are validated automatically you receive your personal survey link immediately; otherwise the survey super admin reviews your request.",
          fr:"Demandez un accès. Si vos informations sont validées automatiquement, vous recevez immédiatement votre lien personnel d'enquête ; sinon, le super administrateur examine votre demande.",
          ar:"اطلبوا الوصول. إذا تم التحقق من بياناتكم تلقائياً تستلمون رابط الاستبيان الشخصي فوراً؛ وإلا يراجع المشرف العام طلبكم." },
  name:{ en:"Full name", fr:"Nom complet", ar:"الاسم الكامل" },
  country:{ en:"Country", fr:"Pays", ar:"البلد" },
  cat:{ en:"Organization type / sector", fr:"Type d'organisation / secteur", ar:"نوع المنظمة / القطاع" },
  jobtitle:{ en:"Job title", fr:"Intitulé du poste", ar:"المسمى الوظيفي" },
  level:{ en:"Hierarchical level", fr:"Niveau hiérarchique", ar:"المستوى الوظيفي" },
  email:{ en:"Email", fr:"Courriel", ar:"البريد الإلكتروني" },
  phone:{ en:"or phone", fr:"ou téléphone", ar:"أو الهاتف" },
  send:{ en:"Request access", fr:"Demander l'accès", ar:"طلب الوصول" },
  missing:{ en:"Please complete every field and give an email or a phone number.",
            fr:"Veuillez remplir tous les champs et indiquer un courriel ou un numéro de téléphone.",
            ar:"يُرجى تعبئة جميع الحقول وتقديم بريد إلكتروني أو رقم هاتف." },
  duplicate:{ en:"A request or access already exists for this email.",
              fr:"Une demande ou un accès existe déjà pour ce courriel.",
              ar:"يوجد طلب أو وصول مسبق لهذا البريد الإلكتروني." },
  autoOk:{ en:"Access granted automatically. Open your personal survey link (also sent to you when email delivery is configured):",
           fr:"Accès accordé automatiquement. Ouvrez votre lien personnel d'enquête (également envoyé lorsque l'envoi de courriels est configuré) :",
           ar:"تم منح الوصول تلقائياً. افتحوا رابط الاستبيان الشخصي (يُرسل أيضاً عند تفعيل البريد الإلكتروني):" },
  goSurvey:{ en:"Start my survey now", fr:"Commencer mon enquête maintenant", ar:"بدء الاستبيان الآن" },
  pendingQuota:{ en:"The seats for this profile in your country are taken. Your request has been sent to the super admin for review.",
                 fr:"Les places pour ce profil dans votre pays sont prises. Votre demande a été transmise au super administrateur.",
                 ar:"المقاعد المخصصة لهذا الملف في بلدكم مشغولة. أُحيل طلبكم إلى المشرف العام للمراجعة." },
  pendingWave:{ en:"Your country is not yet open for the survey. Your request has been waitlisted with the super admin.",
                fr:"Votre pays n'est pas encore ouvert à l'enquête. Votre demande est en liste d'attente auprès du super administrateur.",
                ar:"بلدكم غير مفتوح للاستبيان بعد. وُضع طلبكم في قائمة انتظار لدى المشرف العام." },
  proto:{ en:"Respondents normally enter through the personal link sent by their survey administrator; the profiles below are one-click demonstration entries.",
          fr:"Les répondants entrent normalement par le lien personnel envoyé par leur administrateur d'enquête ; les profils ci-dessous sont des entrées de démonstration en un clic.",
          ar:"يدخل المجيبون عادةً عبر الرابط الشخصي المرسل من مسؤول الاستبيان؛ والملفات أدناه مداخل عرض توضيحي بنقرة واحدة." },
  choose:{ en:"Select…", fr:"Sélectionnez…", ar:"اختاروا…" },
  closedTag:{ en:"not yet open", fr:"pas encore ouvert", ar:"غير مفتوح بعد" }
};

document.getElementById("g-app").textContent = T(I.product.name);
document.getElementById("g-title").textContent = T(I.hero.title);
document.getElementById("g-partners").textContent = T(I.partners);
document.getElementById("g-proto").textContent = T(GATE.proto);
document.getElementById("g-owner").textContent = T(I.product.owner);
document.getElementById("g-foot").textContent = T(I.footer.privacy);
document.getElementById("obj-t").textContent = T(I.objectives.title);
document.getElementById("obj-b").textContent = T(I.objectives.body);
document.getElementById("langs").innerHTML = ["en","fr","ar"].map(function(l){
  return '<button type="button" style="border-color:var(--line);color:var(--navy)" aria-pressed="' + (l === qiLang) + '" onclick="setLang(\'' + l + '\')">' + I.langNames[l] + '</button>';
}).join("");
document.querySelectorAll('#langs button').forEach(function(b){
  if (b.getAttribute("aria-pressed") === "true") { b.style.background = "var(--navy)"; b.style.color = "#fff"; b.style.borderColor = "var(--navy)"; }
});

// Partner logos: real files when provided, clean wordmarks otherwise.
var LOGOS = [["auda-nepad","AUDA-NEPAD"],["unido","UNIDO"],["auc","African Union Commission"],["oacps","OACPS"]];
document.getElementById("plogos").innerHTML = LOGOS.map(function(l){
  return '<span class="plogo"><img src="logos/' + l[0] + '.png" alt="' + l[1] + '" loading="lazy" ' +
    'onerror="this.parentNode.classList.add(\'txt\');this.remove()"><i>' + l[1] + '</i></span>';
}).join("");

// Three survey spaces with live open-country counts.
var REG = [["africa"],["caribbean"],["pacific"]];
function paintSpaces(statusMap){
  document.getElementById("spaces").innerHTML = REG.map(function(r){
    var reg = r[0];
    var all = QI_COUNTRIES.filter(function(c){ return c.region === reg; });
    var open = all.filter(function(c){ return statusMap[c.iso3]; });
    return '<div class="space ' + reg + '" data-reg="' + reg + '">' +
      '<b>' + esc(T(I.regions[reg])) + '</b>' +
      '<span class="cnt">' + open.length + ' ' + esc(T(I.regions.ofN)) + ' ' + all.length + ' ' + esc(T(I.regions.open)) + '</span>' +
      '<span class="sub">' + esc(T(I.regions[reg + "Sub"])) + '</span></div>';
  }).join("");
}
paintSpaces(QI_COUNTRIES.reduce(function(m, c){ m[c.iso3] = c.w1; return m; }, {}));
QIDB.countryStatus().then(function(st){
  paintSpaces(st);
  paintCountrySelect(st);
});

var tabL = document.getElementById("tab-login"), tabS = document.getElementById("tab-signup");
tabL.textContent = T(GATE.tabLogin); tabS.textContent = T(GATE.tabSignup);
function showTab(which){
  var login = which === "login";
  tabL.setAttribute("aria-selected", login); tabS.setAttribute("aria-selected", !login);
  document.getElementById("f-login").style.display = login ? "block" : "none";
  document.getElementById("f-signup").style.display = login ? "none" : "block";
}
tabL.onclick = function(){ showTab("login"); };
tabS.onclick = function(){ showTab("signup"); };

// ---- log in: one-click demo profiles ----
var ROLES = [
  { v:"resp", t:{ en:"Respondent (demo)", fr:"Répondant (démo)", ar:"مجيب (تجريبي)" },
    d:{ en:"Enter as the demo respondent (Ghana, national standards body) and take the adaptive survey.",
        fr:"Entrez comme répondant démo (Ghana, organisme national de normalisation) et répondez à l'enquête adaptative.",
        ar:"ادخلوا كمجيب تجريبي (غانا، هيئة المواصفات الوطنية) وشاركوا في الاستبيان التكيفي." } },
  { v:"admin", t:{ en:"Admin (UNIDO / AUDA-NEPAD / AUC / OACPS)", fr:"Admin (ONUDI / AUDA-NEPAD / CUA / OEACP)", ar:"مدير (اليونيدو / أودا-نيباد / المفوضية / الأواكبس)" },
    d:{ en:"Enter the administration console: invitations, approvals, scoped data downloads.",
        fr:"Entrez dans la console d'administration : invitations, approbations, téléchargements de données selon les droits.",
        ar:"ادخلوا إلى وحدة الإدارة: الدعوات والموافقات وتنزيل البيانات وفق الصلاحيات." } },
  { v:"super", t:{ en:"Super admin", fr:"Super administrateur", ar:"المشرف العام" },
    d:{ en:"Enter as the super admin: open countries, create administrators, define rights, manage quotas.",
        fr:"Entrez comme super administrateur : ouvrir des pays, créer des administrateurs, définir les droits, gérer les quotas.",
        ar:"ادخلوا كمشرف عام: فتح البلدان وإنشاء المديرين وتحديد الصلاحيات وإدارة الحصص." } }
];
var LTXT = {
  intro:{ en:"Prototype sign-in: choose a profile; the system opens the page that matches it. Administrators on the live database sign in with email and password on the admin page.",
          fr:"Connexion prototype : choisissez un profil ; le système ouvre la page correspondante. Sur la base de données en ligne, les administrateurs se connectent par courriel et mot de passe sur la page admin.",
          ar:"دخول تجريبي: اختاروا الملف؛ يفتح النظام الصفحة المناسبة. على قاعدة البيانات المباشرة يسجّل المديرون الدخول بالبريد وكلمة المرور في صفحة الإدارة." },
  enter:{ en:"Sign in", fr:"Se connecter", ar:"تسجيل الدخول" },
  note:{ en:"In production, respondents enter with the personal 7-day link from their invitation email.",
         fr:"En production, les répondants entrent avec le lien personnel de 7 jours reçu par courriel.",
         ar:"في النسخة النهائية يدخل المجيبون عبر الرابط الشخصي الصالح سبعة أيام الوارد في الدعوة." }
};
document.getElementById("l-intro").textContent = T(LTXT.intro);
document.getElementById("b-login").textContent = T(LTXT.enter);
document.getElementById("h-id").textContent = T(LTXT.note);
var picked = "resp";
function paintRoles(){
  document.getElementById("rolepick").innerHTML = ROLES.map(function(r){
    return '<div class="rolecard' + (picked === r.v ? " sel" : "") + '" data-role="' + r.v + '" role="radio" aria-checked="' + (picked === r.v) + '" tabindex="0">' +
      '<b>' + esc(T(r.t)) + '</b><span>' + esc(T(r.d)) + '</span></div>';
  }).join("");
  document.querySelectorAll("#rolepick .rolecard").forEach(function(c){
    function choose(){ picked = c.getAttribute("data-role"); paintRoles(); }
    c.addEventListener("click", choose);
    c.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choose(); } });
  });
}
paintRoles();
document.getElementById("f-login").addEventListener("submit", function(e){
  e.preventDefault();
  if (picked === "resp") {
    var r = QIA.login("GHA-NSB-01", "2468");
    if (!r.ok) { QIA.resetDemo(); QIA.reload(); r = QIA.login("GHA-NSB-01", "2468"); }
    if (r.ok) { location.href = "home.html?lang=" + qiLang; return; }
    var m = document.getElementById("m-login"); m.className = "gatemsg err"; m.textContent = T(A.wrongId);
    return;
  }
  try { localStorage.setItem("qi_admin_role", picked === "super" ? "super" : "unido"); } catch(err){}
  location.href = "admin.html?lang=" + qiLang;
});

// ---- sign up ----
document.getElementById("s-intro").textContent = T(GATE.intro);
document.getElementById("lb-name").textContent = T(GATE.name);
document.getElementById("lb-country").textContent = T(GATE.country);
document.getElementById("lb-cat").textContent = T(GATE.cat);
document.getElementById("lb-title").textContent = T(GATE.jobtitle);
document.getElementById("lb-level").textContent = T(GATE.level);
document.getElementById("lb-email").textContent = T(GATE.email);
document.getElementById("lb-phone").textContent = T(GATE.phone);
document.getElementById("b-signup").textContent = T(GATE.send);

var csel = document.getElementById("s-country");
function paintCountrySelect(statusMap){
  var groups = ["africa","caribbean","pacific"].map(function(reg){
    var opts = QI_COUNTRIES.filter(function(c){ return c.region === reg; })
      .sort(function(a, b){ return a[qiLang].localeCompare(b[qiLang], qiLang); })
      .map(function(c){
        var open = statusMap ? statusMap[c.iso3] : c.w1;
        return '<option value="' + c.iso3 + '">' + esc(c[qiLang]) + (open ? "" : " · " + esc(T(GATE.closedTag))) + '</option>';
      }).join("");
    return '<optgroup label="' + esc(T(I.regions[reg])) + '">' + opts + '</optgroup>';
  }).join("");
  csel.innerHTML = '<option value="">' + esc(T(GATE.choose)) + '</option>' + groups;
}
paintCountrySelect(null);
var P2 = QI_BANK_P1.profile.find(function(q){ return q.id === "P2"; });
var P3 = QI_BANK_P1.profile.find(function(q){ return q.id === "P3"; });
document.getElementById("s-cat").innerHTML = '<option value="">' + esc(T(GATE.choose)) + '</option>' +
  P2.opts.map(function(o){ return '<option value="' + o.v + '">' + esc(T(o.t)) + '</option>'; }).join("");
document.getElementById("s-level").innerHTML = '<option value="">' + esc(T(GATE.choose)) + '</option>' +
  P3.opts.map(function(o){ return '<option value="' + o.v + '">' + esc(T(o.t)) + '</option>'; }).join("");

function showIssued(link){
  var box = document.getElementById("issued");
  box.style.display = "block";
  box.innerHTML = "<b>" + esc(T(GATE.autoOk)) + "</b>" +
    '<div class="big" style="font-size:13px;word-break:break-all">' + esc(link) + "</div>" +
    '<a class="gatebtn" style="display:block;text-align:center;text-decoration:none;margin-top:8px" href="' + esc(link) + '">' + esc(T(GATE.goSurvey)) + "</a>";
}

document.getElementById("f-signup").addEventListener("submit", function(e){
  e.preventDefault();
  var m = document.getElementById("m-signup"); m.className = "gatemsg";
  var box = document.getElementById("issued"); box.style.display = "none";
  var p = {
    name: document.getElementById("s-name").value.trim(),
    iso3: csel.value,
    category: document.getElementById("s-cat").value,
    job_title: document.getElementById("s-title").value.trim(),
    level: document.getElementById("s-level").value,
    email: document.getElementById("s-email").value.trim(),
    phone: document.getElementById("s-phone").value.trim()
  };
  if (!p.name || !p.iso3 || !p.category || !p.level || (!p.email && !p.phone)) {
    m.className = "gatemsg err"; m.textContent = T(GATE.missing); return;
  }
  if (QIDB.mode() === "live") {
    QIDB.requestAccess(p).then(function(r){
      if (!r || !r.ok) { m.className = "gatemsg err"; m.textContent = T(r && r.why === "duplicate" ? GATE.duplicate : GATE.missing); return; }
      if (r.mode === "auto") { showIssued(location.origin + location.pathname.replace(/index\.html$/, "") + "survey.html?rt=" + r.token + "&lang=" + qiLang); }
      else { m.className = "gatemsg ok"; m.textContent = T(r.reason === "quota" ? GATE.pendingQuota : GATE.pendingWave); }
    });
    return;
  }
  var r = QIA.signup({ name:p.name, iso3:p.iso3, cat:p.category, title:p.job_title, level:p.level, email:p.email, phone:p.phone });
  if (!r.ok) { m.className = "gatemsg err"; m.textContent = T(r.why === "duplicate" ? GATE.duplicate : GATE.missing); return; }
  if (r.mode === "auto") {
    QIDB.createInvite({ email:p.email || p.phone, name:p.name, iso3:p.iso3, category:p.category, level:p.level, created_by:"auto-validation" })
      .then(function(iv){ showIssued(location.origin + location.pathname.replace(/index\.html$/, "") + "survey.html?rt=" + iv.token + "&lang=" + qiLang); });
  } else {
    m.className = "gatemsg ok";
    m.textContent = T(r.reason === "quota" ? GATE.pendingQuota : GATE.pendingWave);
  }
});
document.title = T(I.product.name) + " · " + T(I.siteTitle);
</script>
</body>
</html>
